name: roket_dok
description: "рокет док — RocketDock Portable macOS Edition v2.6.3 — Fixed glyph rendering (standard Material/Cupertino glyphs), 2D pointer proximity zoom in multi-row grids so only one icon per row is highlighted, classic RocketDock 1.3.5 Settings.ini import, and zero-lag Win32 FFI telemetry."
publish_to: 'none'
version: 2.6.3+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  window_manager: ^0.3.9
  file_selector: ^1.0.3
  tray_manager: ^0.2.2
  desktop_drop: ^0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/app_icon.png
