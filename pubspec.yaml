name: roket_dok
description: "рокет док — портативная панель запуска в стиле RocketDock 1.3.5 для Windows: иконки с прозрачностью (PNG, до 256 px), 2D-зум по наведению, импорт Settings.ini и Win32 FFI телеметрия."
publish_to: 'none'
version: 2.7.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  window_manager: ^0.3.9
  file_selector: ^1.0.3
  tray_manager: ^0.2.2
  desktop_drop: ^0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/app_icon.png
