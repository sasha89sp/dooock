  - Реализованы все 5 улучшений: (1) мультимониторное позиционирование через Win32 EnumDisplayMonitors/GetMonitorInfoW, (2) нативное извлечение иконок в 32-bit BMP через SHGetFileInfoW/GetDIBits без запуска PowerShell, (3) авто-экономичный режим при работе от батареи и заморозка при полноэкранных играх/видео, (4) быстрый запуск первых 9 значков по Alt+1..9, (5) переключение сохранённых профилей из profiles/ в один клик из меню ПКМ.
