name: Windows Build Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter create . --platforms=windows

      - name: Apply macOS-Style Executable Icon
        shell: pwsh
        run: |
          if (Test-Path "assets/app_icon.ico") {
            Copy-Item -Path "assets/app_icon.ico" -Destination "windows/runner/resources/app_icon.ico" -Force
          }

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Portable Windows Release
        run: flutter build windows --release

      - name: Upload Portable Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketdock-windows-portable
          path: build/windows/x64/runner/release/
